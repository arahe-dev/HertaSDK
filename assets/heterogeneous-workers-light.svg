<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="hwl-t hwl-d">
  <title id="hwl-t">Asynchronous heterogeneous workers sharing one environment</title>
  <desc id="hwl-d">Five independent workers — render, events, catalogue, webhook, model call — run at their own pace with different rhythms, all obeying the shared Herta runtime for budgets, admission, and error semantics.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="hw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444444"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">independent pace · shared rules</text>
    <g font-size="12" font-weight="650" fill="#111111">
      <rect x="20" y="48" width="112" height="30" rx="8" fill="#f4f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="76" y="68" text-anchor="middle">render</text>
      <rect x="20" y="88" width="112" height="30" rx="8" fill="#f4f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="76" y="108" text-anchor="middle">events</text>
      <rect x="20" y="128" width="112" height="30" rx="8" fill="#f4f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="76" y="148" text-anchor="middle">catalogue</text>
      <rect x="20" y="168" width="112" height="30" rx="8" fill="#f4f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="76" y="188" text-anchor="middle">webhook</text>
      <rect x="20" y="208" width="112" height="30" rx="8" fill="#f4f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="76" y="228" text-anchor="middle">model call</text>
    </g>
    <g stroke-linecap="round" stroke-width="5">
      <line x1="150" y1="63" x2="196" y2="63" stroke="#111111"/>
      <line x1="204" y1="63" x2="222" y2="63" stroke="#bbbbbb"/>
      <line x1="230" y1="63" x2="292" y2="63" stroke="#111111"/>
      <line x1="150" y1="103" x2="180" y2="103" stroke="#111111"/>
      <line x1="188" y1="103" x2="252" y2="103" stroke="#bbbbbb"/>
      <line x1="260" y1="103" x2="292" y2="103" stroke="#111111"/>
      <line x1="150" y1="143" x2="240" y2="143" stroke="#111111"/>
      <line x1="248" y1="143" x2="262" y2="143" stroke="#bbbbbb"/>
      <line x1="270" y1="143" x2="292" y2="143" stroke="#111111"/>
      <line x1="150" y1="183" x2="172" y2="183" stroke="#111111"/>
      <line x1="180" y1="183" x2="200" y2="183" stroke="#bbbbbb"/>
      <line x1="208" y1="183" x2="244" y2="183" stroke="#111111"/>
      <line x1="252" y1="183" x2="292" y2="183" stroke="#bbbbbb"/>
      <line x1="150" y1="223" x2="214" y2="223" stroke="#bbbbbb"/>
      <line x1="222" y1="223" x2="292" y2="223" stroke="#111111"/>
    </g>
    <g font-size="10" fill="#555555">
      <text x="150" y="42" text-anchor="start">each row: its own rhythm</text>
      <text x="292" y="42" text-anchor="end">● executing   ● waiting</text>
    </g>
    <g stroke="#444444" stroke-width="1.5">
      <line x1="308" y1="63" x2="346" y2="110" marker-end="url(#hw-arrow)"/>
      <line x1="308" y1="103" x2="346" y2="130" marker-end="url(#hw-arrow)"/>
      <line x1="308" y1="143" x2="346" y2="150" marker-end="url(#hw-arrow)"/>
      <line x1="308" y1="183" x2="346" y2="170" marker-end="url(#hw-arrow)"/>
      <line x1="308" y1="223" x2="346" y2="190" marker-end="url(#hw-arrow)"/>
    </g>
    <rect x="346" y="92" width="160" height="116" rx="12" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="426" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Herta Runtime</text>
    <text x="426" y="136" text-anchor="middle" font-size="12" fill="#333333">one budget · one admission</text>
    <text x="426" y="154" text-anchor="middle" font-size="12" fill="#333333">one error meaning</text>
    <line x1="366" y1="164" x2="486" y2="164" stroke="#111111" stroke-width="1" stroke-dasharray="5 4" opacity="0.45"/>
    <text x="426" y="180" text-anchor="middle" font-size="11" fill="#555555">CAN-style: independent,</text>
    <text x="426" y="195" text-anchor="middle" font-size="11" fill="#555555">obeying shared semantics</text>
    <text x="320" y="248" text-anchor="middle" font-size="12" fill="#333333">Nobody waits on anyone. Everybody obeys the same contract.</text>
    <rect x="180" y="262" width="280" height="46" rx="10" fill="#eef3ff" stroke="#2f6feb" stroke-width="1.6"/>
    <text x="320" y="282" text-anchor="middle" font-size="12" fill="#111111">different speeds, different shapes —</text>
    <text x="320" y="299" text-anchor="middle" font-size="12" font-weight="650" fill="#1f4488">one shared execution meaning</text>
  </g>
</svg>
